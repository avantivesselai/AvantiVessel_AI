<!doctype html>
<html lang="pt-BR">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

</head>
<body>
<x-dc>
<helmet>
<script src="./avanti-app.js"></script>
<script src="./avanti-theme.js"></script>
<style>
body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--av-bg, #05070b); }
a { color: var(--av-accent, #409cff); } a:hover { color: var(--av-link-hover, #6fb3ff); }
button { font: inherit; }
</style>
</helmet>

<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--av-bg, #05070b); color: var(--av-ink, #e9edf2); overflow: hidden;">

  <header style="flex-shrink: 0; box-sizing: border-box; padding: 18px 20px 10px; display: flex; align-items: center; gap: 12px;">
    <a href="H2-Home-Mobile.dc.html" aria-label="Início" style="display: flex; align-items: center; text-decoration: none;"><img src="assets/logo_white.png" alt="Avanti Vessel" style="height: 30px; width: 134px; object-fit: contain; object-position: left; filter: var(--av-logo-filter, none);"></a>
    <div style="flex-grow: 1; display: flex; flex-direction: column; padding-left: 2px;">
      <span style="font-size: 17px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1;">Avanti Vessel AI</span>
      <span style="font-size: 11.5px; font-weight: 500; color: var(--av-ink3, #9aa3af);">Atracado · Rio · 17:43</span>
    </div>
    <a href="A3-Ponte-Editar.dc.html" aria-label="Editar atalhos" style="width: 44px; height: 44px; border-radius: 50%; background: var(--av-card, #0f131a); border: 1px solid var(--av-line, #1d2229); display: flex; align-items: center; justify-content: center; color: var(--av-ink, #e9edf2); text-decoration: none;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 20h4l10-10-4-4L4 16z M14 6l4 4" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"></path></svg>
    </a>
  </header>

  <div style="flex-grow: 1; box-sizing: border-box; padding: 6px 16px 12px; display: flex; flex-direction: column; gap: 12px; min-height: 0;">

    <a href="B2-Carta-Mobile.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 14px; background: var(--av-card, #0f131a); border-radius: 18px; box-shadow: 0 1px 2px rgba(var(--av-shadow-rgb, 0,0,0), calc(0.25 * var(--av-shadow-k, 1))), 0 6px 18px rgba(var(--av-shadow-rgb, 0,0,0), calc(0.30 * var(--av-shadow-k, 1))); text-decoration: none; color: var(--av-ink, #e9edf2);">
      <span style="width: 46px; height: 46px; flex-shrink: 0; border-radius: 14px; background: {{atrWash}}; display: flex; align-items: center; justify-content: center;">
        <span style="font-size: 24px; font-weight: 800; color: {{atrTone}}; line-height: 1;">{{atr}}</span>
      </span>
      <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px;">
        <span style="font-size: 15px; font-weight: 800;">{{atrTitle}}</span>
        <span style="font-size: 12.5px; color: var(--av-ink3, #9aa3af);">{{atrSub}}</span>
      </span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="flex-shrink: 0;"><path d="M9 5l7 7-7 7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="stroke: var(--av-ink3, var(--av-ink3, #9aa3af));"></path></svg>
    </a>

    <div style="flex-grow: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr); gap: 12px; min-height: 0;">
      <sc-for list="{{tiles}}" as="t" hint-placeholder-count="6">
        <a href="{{t.href}}" style="box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; padding: 14px; background: var(--av-card, #0f131a); border-radius: 20px; box-shadow: 0 1px 2px rgba(var(--av-shadow-rgb, 0,0,0), calc(0.25 * var(--av-shadow-k, 1))), 0 6px 18px rgba(var(--av-shadow-rgb, 0,0,0), calc(0.30 * var(--av-shadow-k, 1))); text-decoration: none; color: var(--av-ink, #e9edf2);">
          <span style="width: 48px; height: 48px; border-radius: 15px; background: {{t.wash}}; display: flex; align-items: center; justify-content: center;">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="{{t.d}}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="stroke: {{t.tone}};"></path></svg>
          </span>
          <span style="display: flex; flex-direction: column; gap: 2px;">
            <span style="font-size: 18px; font-weight: 800; letter-spacing: -0.01em;">{{t.label}}</span>
            <span style="font-size: 12px; font-weight: 500; color: var(--av-ink3, #9aa3af);">{{t.sub}}</span>
          </span>
        </a>
      </sc-for>
    </div>
  </div>

  <div style="flex-shrink: 0; box-sizing: border-box; padding: 0 16px 20px; display: flex; flex-direction: column; gap: 10px;">
    <a href="B3-Carta-Resposta.dc.html" style="height: 72px; border-radius: 20px; background: var(--av-accent, #409cff); color: var(--av-on-accent, #05070b); display: flex; align-items: center; justify-content: center; gap: 14px; text-decoration: none; box-shadow: 0 8px 24px rgba(var(--av-accent-rgb, 64,156,255), 0.25);">
      <span style="width: 44px; height: 44px; border-radius: 50%; background: var(--av-bg, #05070b); color: var(--av-accent, #409cff); display: flex; align-items: center; justify-content: center;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z M5 11a7 7 0 0 0 14 0 M12 18v3" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </span>
      <span style="display: flex; flex-direction: column; align-items: flex-start;">
        <span style="font-size: 19px; font-weight: 800;">Falar com o barco</span>
        <span style="font-size: 12px; font-weight: 600; color: var(--av-on-accent2, #0a2c52);">toque = voz → texto · segure = conversa contínua</span>
      </span>
    </a>

    <div style="display: flex; gap: 10px;">
      <a href="H2-Home-Mobile.dc.html#mode=foto" aria-label="Enviar foto" style="width: 68px; height: 58px; border-radius: 16px; border: 1px solid var(--av-line, #1d2229); background: var(--av-card, #0f131a); color: var(--av-ink, #e9edf2); display: flex; align-items: center; justify-content: center; text-decoration: none; display: flex; align-items: center; justify-content: center; box-sizing: border-box;">
        <svg width="25" height="25" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 8h3l2-2h6l2 2h3v11H4z M12 16a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"></path></svg>
      </a>
      <a href="H2-Home-Mobile.dc.html#mode=video" aria-label="Enviar vídeo" style="width: 68px; height: 58px; border-radius: 16px; border: 1px solid var(--av-line, #1d2229); background: var(--av-card, #0f131a); color: var(--av-ink, #e9edf2); display: flex; align-items: center; justify-content: center; text-decoration: none; display: flex; align-items: center; justify-content: center; box-sizing: border-box;">
        <svg width="25" height="25" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 7h11v10H3z M14 11l6-3.5v9L14 13z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"></path></svg>
      </a>
      <a href="S2-SOS-Mobile.dc.html" style="flex-grow: 1; height: 58px; border-radius: 16px; background: var(--av-crit-fill, #d32f27); color: var(--av-card, #0f131a); display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; box-shadow: 0 0 0 3px rgba(var(--av-crit-rgb, 255,59,48), 0.28), 0 10px 26px rgba(var(--av-critfill-rgb, 211,47,39), 0.40);">
        <span style="font-size: 19px; font-weight: 800; letter-spacing: 0.12em; line-height: 1;">SOS</span>
        <span style="width: 1px; height: 22px; background: rgba(var(--av-hl-rgb, 255,255,255), 0.4);"></span>
        <span style="font-size: 13px; font-weight: 700; letter-spacing: 0.10em;">EMERGÊNCIA</span>
      </a>
    </div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { exec: {} };
  // Mesma fonte do C1 (Executado): as atrasadas saem da agenda menos o que já foi executado
  load() { let m = {}; try { const v = JSON.parse(localStorage.getItem('avanti.executado.v1') || '{}'); if (v && typeof v === 'object' && !Array.isArray(v)) m = v; } catch (e) {} this.setState({ exec: m }); }
  componentDidMount() { this.load(); this._st = (e) => { if (!e || e.key === null || e.key === 'avanti.executado.v1') this.load(); }; window.addEventListener('storage', this._st); }
  componentWillUnmount() { window.removeEventListener('storage', this._st); }
  renderVals() {
    const ex = this.state.exec || {};
    const atr = [{ task: 'Teste de bombas de porão e alarmes', l: 'Porão · 100 d' }, { task: 'Limpeza de filtros do chiller', l: 'Chiller' }, { task: 'Verificação de tensões e conexões', l: 'Tensões · 1 d' }].filter((t) => !ex[t.task]);
    const n = atr.length;
    return {
      atr: String(n), atrTitle: n === 1 ? 'Manutenção atrasada' : 'Manutenções atrasadas',
      atrSub: n ? atr.map((t) => t.l).join(' \u00a0·\u00a0 ') : 'Nada atrasado · executadas no diário',
      atrTone: n ? 'var(--av-crit, #ff3b30)' : 'var(--av-ok, #34c77a)', atrWash: n ? 'rgba(var(--av-crit-rgb, 255,59,48), 0.12)' : 'rgba(var(--av-ok-rgb, 52,199,122), 0.12)',
      tiles: [
        { href: 'B3-Carta-Resposta.dc.html', label: 'Motores', sub: 'BB 110,0 h · BE 106,0 h', d: 'M4 17V9l3-4h7l3 4v8z M8 17v3 M16 17v3 M8 9h8', tone: 'var(--av-tele, #5ac8fa)', wash: 'rgba(var(--av-tele-rgb, 90,200,250), 0.12)' },
        { href: 'B2-Carta-Mobile.dc.html', label: 'Manutenção', sub: (n ? n + (n === 1 ? ' atrasada' : ' atrasadas') : 'nenhuma atrasada') + ' · 35 tarefas', d: 'M14.7 6.3a4 4 0 0 0-5.4 5.4L4 17v3h3l5.3-5.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.5-.5-.5-2.5z', tone: 'var(--av-warn, #f0a63a)', wash: 'rgba(var(--av-warn-rgb, 240,166,58), 0.12)' },
        { href: 'E1-Navegando-Gatilhos.dc.html', label: 'Telemetria', sub: 'ao vivo · 10 s', d: 'M3 16c2-3 4-3 6 0s4 3 6 0 4-3 6 0M3 9c2-3 4-3 6 0s4 3 6 0 4-3 6 0', tone: 'var(--av-tele, #5ac8fa)', wash: 'rgba(var(--av-tele-rgb, 90,200,250), 0.12)' },
        { href: 'E1-Navegando-Gatilhos.dc.html', label: 'Navegação', sub: 'maré · clima · VHF', d: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z M15.5 8.5l-2 5-5 2 2-5z', tone: 'var(--av-accent, #409cff)', wash: 'rgba(var(--av-accent-rgb, 64,156,255), 0.12)' },
        { href: 'G1-Documentos-Mobile.dc.html', label: 'Documentos', sub: 'FISTEL em 120 dias', d: 'M6 3h8l4 4v14H6z M14 3v4h4 M9 13h6 M9 17h4', tone: 'var(--av-accent, #409cff)', wash: 'rgba(var(--av-accent-rgb, 64,156,255), 0.12)' },
        { href: 'G3-Diario-Mobile.dc.html', label: 'Diário', sub: 'registrar agora', d: 'M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z M8 20a3 3 0 0 1 0-6h11', tone: 'var(--av-accent, #409cff)', wash: 'rgba(var(--av-accent-rgb, 64,156,255), 0.16)' }
      ]
    };
  }
}
</script>
</body>
</html>
