<!doctype html>
<html lang="pt-BR">

<x-dc>
<helmet>
<script src="./avanti-app.js"></script>

<style>
body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--av-bg, #05070b); }
a { color: var(--av-accent, #409cff); } a:hover { color: var(--av-link-hover, #6fb3ff); }
button { font: inherit; }
</style>
</helmet>

      <a href="H2-Home-Mobile.dc.html" aria-label="Início" style="display: flex; align-items: center; text-decoration: none;"><img src="assets/logo_white.png" alt="Avanti Vessel" style="height: 26px; width: 116px; object-fit: contain; filter: var(--av-logo-filter, none);"></a>
      <span style="width: 1px; height: 24px; background: var(--av-line2, #2a3240);"></span>
      <span style="flex-grow: 1; font-size: 16px; font-weight: 700; letter-spacing: -0.01em;">Navegando</span>
      <span style="display: flex; align-items: center; gap: 6px; padding: 7px 11px; background: rgba(var(--av-accent-rgb, 64,156,255), 0.14); border-radius: 999px;">
        <span style="width: 7px; height: 7px; border-radius: 50%; background: var(--av-accent, #409cff); box-shadow: 0 0 0 3px rgba(var(--av-accent-rgb, 64,156,255), 0.25);"></span>
        <span style="font-size: 11.5px; font-weight: 700; color: var(--av-accent, #409cff);">0:42 de viagem</span>
      </span>
    </div>
    <div style="display: flex; align-items: baseline; justify-content: space-between;">
      <span style="font-size: 11.5px; font-weight: 500; color: var(--av-ink3, #9aa3af); white-space: nowrap;">Saída 09:37 · Marina · rumo ao posto</span>
      <span style="font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 10.5px; color: var(--av-ink3, #9aa3af); white-space: nowrap;">22°55,3'S 043°09,8'W</span>
    </div>
  </header>

  <div style="flex-grow: 1; box-sizing: border-box; padding: 12px 16px 10px; display: flex; flex-direction: column; gap: 10px; min-height: 0;">

    <a href="C3-Leme-Alerta.dc.html" style="box-sizing: border-box; padding: 11px 13px; background: var(--av-card, #0f131a); border: 1px solid var(--av-line, #1d2229); border-radius: 16px; display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: var(--av-ink, #e9edf2);">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span style="width: 8px; height: 8px; border-radius: 50%; background: var(--av-ok, #34c77a); box-shadow: 0 0 0 3px rgba(var(--av-ok-rgb, 52,199,122), 0.22);"></span>
        <span style="flex-grow: 1; font-size: 12.5px; font-weight: 700;">Vigia da IA · tudo na faixa do manual</span>
        <span style="font-size: 11px; color: var(--av-ink3, #9aa3af);">6 sistemas</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px;">
        <sc-for list="{{watch}}" as="w" hint-placeholder-count="4">
          <div style="padding: 7px 8px; background: var(--av-elev, #151a23); border-radius: 10px; display: flex; flex-direction: column; gap: 1px;">
            <span style="font-size: 9.5px; font-weight: 600; color: var(--av-ink3, #9aa3af);">{{w.k}}</span>
            <span style="font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.01em;">{{w.v}}</span>
            <span style="font-size: 9.5px; color: var(--av-ok, #34c77a);">{{w.s}}</span>
          </div>
        </sc-for>
      </div>
    </a>

    <div style="flex-grow: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr); gap: 10px; min-height: 0;">
      <sc-for list="{{triggers}}" as="t" hint-placeholder-count="6">
        <a href="{{t.href}}" style="box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; padding: 13px; background: {{t.bg}}; border: 1px solid {{t.line}}; border-radius: 18px; text-decoration: none; color: {{t.ink}};">
          <span style="display: flex; align-items: flex-start; justify-content: space-between;">
            <span style="width: 40px; height: 40px; border-radius: 12px; background: {{t.wash}}; display: flex; align-items: center; justify-content: center;">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="{{t.d}}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="stroke: {{t.tone}};"></path></svg>
            </span>
            <sc-if value="{{t.badge}}" hint-placeholder-val="{{true}}">
              <span style="padding: 4px 8px; border-radius: 999px; background: {{t.wash}}; color: {{t.tone}}; font-size: 11px; font-weight: 800; font-variant-numeric: tabular-nums;">{{t.badge}}</span>
            </sc-if>
          </span>
          <span style="display: flex; flex-direction: column; gap: 2px;">
            <span style="font-size: 16px; font-weight: 800; letter-spacing: -0.01em;">{{t.label}}</span>
            <span style="font-size: 11px; line-height: 1.3; color: {{t.sub_tone}};">{{t.sub}}</span>
          </span>
        </a>
      </sc-for>
    </div>

    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; flex-shrink: 0;">
      <sc-for list="{{quick}}" as="q" hint-placeholder-count="4">
        <a href="{{q.href}}" style="box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 9px 4px; background: var(--av-card, #0f131a); border: 1px solid var(--av-line, #1d2229); border-radius: 14px; text-decoration: none; color: var(--av-ink, #e9edf2); min-height: 60px;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="{{q.d}}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="stroke: var(--av-ink2, var(--av-ink2, #aeb6c2));"></path></svg>
          <span style="font-size: 10.5px; font-weight: 700; text-align: center; line-height: 1.15;">{{q.n}}</span>
        </a>
      </sc-for>
    </div>

    <a href="S2-SOS-Mobile.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 12px; height: 52px; flex-shrink: 0; background: var(--av-crit-fill, #d32f27); border-radius: 16px; text-decoration: none; color: #ffffff; box-shadow: 0 0 0 3px rgba(var(--av-crit-rgb, 255,59,48), 0.28), 0 10px 26px rgba(var(--av-critfill-rgb, 211,47,39), 0.40);">
      <span style="font-size: 19px; font-weight: 800; letter-spacing: 0.12em; line-height: 1;">SOS</span>
      <span style="width: 1px; height: 22px; background: rgba(var(--av-hl-rgb, 255,255,255), 0.4);"></span>
      <span style="font-size: 13px; font-weight: 700; letter-spacing: 0.10em;">EMERGÊNCIA · ALARME SONORO</span>
    </a>
  </div>

  <div style="flex-shrink: 0; box-sizing: border-box; padding: 10px 16px 18px; border-top: 1px solid var(--av-line, #1d2229); display: flex; align-items: center; gap: 10px;">
    <a href="H2-Home-Mobile.dc.html#mode=foto" aria-label="Enviar foto" style="width: 56px; height: 56px; border-radius: 16px; border: 1px solid var(--av-line, #1d2229); background: var(--av-card, #0f131a); color: var(--av-ink2, #aeb6c2); display: flex; align-items: center; justify-content: center; text-decoration: none; display: flex; align-items: center; justify-content: center; box-sizing: border-box;">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 8h3l2-2h6l2 2h3v11H4z M12 16a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"></path></svg>
    </a>
    <a href="B3-Carta-Resposta.dc.html" style="flex-grow: 1; height: 56px; border-radius: 16px; background: var(--av-accent, #409cff); color: var(--av-on-accent, #05070b); display: flex; align-items: center; justify-content: center; gap: 9px; text-decoration: none;">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z M5 11a7 7 0 0 0 14 0 M12 18v3" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      <span style="display: flex; flex-direction: column; align-items: flex-start; line-height: 1.1;">
        <span style="font-size: 15px; font-weight: 800;">Falar</span>
        <span style="font-size: 10.5px; font-weight: 600; color: var(--av-on-accent2, #0a2c52);">mãos no leme, sem olhar</span>
      </span>
    </a>
    <a href="H2-Home-Mobile.dc.html#mode=texto" aria-label="Digitar" style="width: 56px; height: 56px; border-radius: 16px; border: 1px solid var(--av-line, #1d2229); background: var(--av-card, #0f131a); color: var(--av-ink2, #aeb6c2); display: flex; align-items: center; justify-content: center; text-decoration: none; display: flex; align-items: center; justify-content: center; box-sizing: border-box;">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 6h18v12H3z M7 10h.01 M11 10h.01 M15 10h.01 M8 14h8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </a>
  </div>

</div>
