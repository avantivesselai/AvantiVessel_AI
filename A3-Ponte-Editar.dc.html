<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./avanti-auth.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<script src="./avanti-app.js"></script>
<script src="./avanti-theme.js"></script>
<style>
body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--av-bg, #05070b); -webkit-font-smoothing: antialiased; }
a { color: var(--av-accent, #409cff); } a:hover { color: var(--av-link-hover, #6fb3ff); }
button { font: inherit; }
</style>
</helmet>

<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--av-bg, #05070b); color: var(--av-ink, #e9edf2); overflow: hidden;">

  <header style="flex-shrink: 0; box-sizing: border-box; padding: 18px 20px 12px; display: flex; align-items: center; gap: 12px;">
    <div style="flex-grow: 1; display: flex; flex-direction: column; min-width: 0;">
      <span style="font-size: 20px; font-weight: 800; letter-spacing: -0.02em;">Editar blocos do console</span>
      <span style="font-size: 12px; font-weight: 500; color: {{noteTone}}; line-height: 1.3;">{{subtitle}}</span>
    </div>
    <a href="A2-Ponte-Mobile.dc.html" style="height: 44px; padding: 0 18px; border-radius: 999px; background: var(--av-accent, #409cff); color: var(--av-on-accent, #05070b); font-size: 14px; font-weight: 800; display: flex; align-items: center; text-decoration: none; flex-shrink: 0;">Concluir</a>
  </header>

  <div style="flex-shrink: 0; box-sizing: border-box; margin: 0 16px; padding: 11px 14px; background: var(--av-card, #0f131a); border: 1px solid {{hintLine}}; border-radius: 14px; display: flex; gap: 10px; align-items: center;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="flex-shrink: 0;"><path d="M12 8v5 M12 16h.01 M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z" stroke-width="1.7" stroke-linecap="round" style="stroke: var(--av-accent, var(--av-accent, #409cff));"></path></svg>
    <span style="font-size: 12.5px; line-height: 1.4; color: var(--av-ink2, #aeb6c2);">{{hint}}</span>
  </div>

  <div style="flex-grow: 1; box-sizing: border-box; padding: 10px 16px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr); gap: 8px; min-height: 0;">
    <sc-for list="{{tiles}}" as="t" hint-placeholder-count="7">
      <div style="box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; padding: 13px; background: {{t.bg}}; border: 1.5px dashed {{t.line}}; border-radius: 18px; min-height: 0;">
        <span style="display: flex; align-items: flex-start; justify-content: space-between;">
          <button type="button" onClick="{{t.cycle}}" aria-label="Trocar ícone" title="Trocar ícone" style="width: 42px; height: 42px; border-radius: 13px; border: none; background: {{t.wash}}; display: flex; align-items: center; justify-content: center; cursor: pointer;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="flex-shrink: 0;"><path d="{{t.d}}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="stroke: {{t.tone}};"></path></svg>
          </button>
          <button type="button" onClick="{{t.remove}}" aria-label="Remover bloco" style="width: 44px; height: 44px; margin: -9px -9px 0 0; border: none; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0;"><span style="width: 28px; height: 28px; border-radius: 50%; background: var(--av-crit, #ff3b30); color: #FFFFFF; font-size: 19px; font-weight: 800; line-height: 1; display: flex; align-items: center; justify-content: center;">−</span></button>
        </span>
        <span style="display: flex; align-items: flex-end; justify-content: space-between; gap: 6px;">
          <span style="font-size: 15.5px; font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{t.label}}</span>
          <button type="button" onClick="{{t.pick}}" aria-pressed="{{t.moving}}" aria-label="Mover bloco" title="Mover: toque aqui e depois no destino" style="width: 44px; height: 44px; margin: 0 -13px -13px 0; border: none; background: transparent; color: {{t.handleTone}}; display: flex; align-items: center; justify-content: center; cursor: grab; padding: 0; flex-shrink: 0;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="flex-shrink: 0;"><path d="M8 7h.01M8 12h.01M8 17h.01M16 7h.01M16 12h.01M16 17h.01" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"></path></svg></button>
        </span>
      </div>
    </sc-for>

    <sc-if value="{{canAdd}}" hint-placeholder-val="{{true}}">
      <button type="button" onClick="{{focusBank}}" style="box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px; background: transparent; border: 1.5px dashed var(--av-dash, #3a4454); border-radius: 18px; color: var(--av-ink2, #aeb6c2); cursor: pointer; min-height: 0;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="flex-shrink: 0;"><path d="M12 5v14 M5 12h14" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"></path></svg>
        <span style="font-size: 14px; font-weight: 700;">Adicionar</span>
      </button>
    </sc-if>
  </div>

  <div style="flex-shrink: 0; box-sizing: border-box; padding: 12px 16px 16px; border-top: 1px solid var(--av-line, #1d2229); display: flex; flex-direction: column; gap: 9px;">
    <div style="display: flex; align-items: baseline; justify-content: space-between;">
      <span style="font-size: 13px; font-weight: 700;">Banco de blocos</span>
      <span style="display: flex; gap: 12px; align-items: baseline;"><span style="font-size: 11.5px; color: var(--av-ink3, #9aa3af);">{{bankLabel}}</span><button type="button" onClick="{{reset}}" style="border: none; background: transparent; color: var(--av-accent, #409cff); font-size: 11.5px; font-weight: 700; cursor: pointer; padding: 0;">Restaurar padrão</button></span>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 7px; max-height: 84px; overflow-y: auto;">
      <sc-for list="{{bank}}" as="b" hint-placeholder-count="10">
        <button type="button" onClick="{{b.add}}" style="display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 13px; border-radius: 999px; border: 1px solid {{bankLine}}; background: var(--av-card, #0f131a); color: var(--av-ink, #e9edf2); font-size: 12.5px; font-weight: 600; cursor: pointer;">
          <span style="color: var(--av-accent, #409cff); font-size: 16px; line-height: 1;">+</span>{{b.label}}
        </button>
      </sc-for>
    </div>
    <div style="display: flex; align-items: center; gap: 9px; padding: 10px 12px; background: var(--av-card, #0f131a); border-radius: 12px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="flex-shrink: 0;"><path d="M7 11V8a5 5 0 0 1 10 0v3 M5 11h14v9H5z" stroke-width="1.7" stroke-linejoin="round" style="stroke: var(--av-ink3, var(--av-ink3, #9aa3af));"></path></svg>
      <span style="font-size: 11.5px; line-height: 1.4; color: var(--av-ink2, #aeb6c2);"><strong style="color: var(--av-ink, #e9edf2);">SOS</strong> e a barra do assistente são fixos.</span>
    </div>
    <a href="S2-SOS-Mobile.dc.html" style="flex-shrink: 0; display: flex; align-items: center; justify-content: center; gap: 12px; height: 56px; background: var(--av-crit-fill, #d32f27); border-radius: 16px; text-decoration: none; color: #ffffff; box-shadow: 0 0 0 3px rgba(var(--av-crit-rgb, 255,59,48), 0.28), 0 10px 26px rgba(var(--av-critfill-rgb, 211,47,39), 0.40);">
      <span style="font-size: 19px; font-weight: 800; letter-spacing: 0.12em; line-height: 1;">SOS</span>
      <span style="width: 1px; height: 22px; background: rgba(var(--av-hl-rgb, 255,255,255), 0.4);"></span>
      <span style="font-size: 13px; font-weight: 700; letter-spacing: 0.10em;">EMERGÊNCIA</span>
    </a>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  KEY = 'avanti.blocos.v1';
  ICONS = [
    { d: 'M4 17V9l3-4h7l3 4v8z M8 17v3 M16 17v3 M8 9h8', tone: 'var(--av-tele, #5ac8fa)', wash: 'rgba(var(--av-tele-rgb, 90,200,250), 0.14)' },
    { d: 'M14.7 6.3a4 4 0 0 0-5.4 5.4L4 17v3h3l5.3-5.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.5-.5-.5-2.5z', tone: 'var(--av-warn, #f0a63a)', wash: 'rgba(var(--av-warn-rgb, 240,166,58), 0.14)' },
    { d: 'M3 16c2-3 4-3 6 0s4 3 6 0 4-3 6 0M3 9c2-3 4-3 6 0s4 3 6 0 4-3 6 0', tone: 'var(--av-tele, #5ac8fa)', wash: 'rgba(var(--av-tele-rgb, 90,200,250), 0.14)' },
    { d: 'M6 3h8l4 4v14H6z M14 3v4h4 M9 13h6', tone: 'var(--av-accent, #409cff)', wash: 'rgba(var(--av-accent-rgb, 64,156,255), 0.14)' },
    { d: 'M4 6h16v12H4z M8 10h8 M8 14h5', tone: 'var(--av-accent, #409cff)', wash: 'rgba(var(--av-accent-rgb, 64,156,255), 0.14)' },
    { d: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z M15.5 8.5l-2 5-5 2 2-5z', tone: 'var(--av-accent, #409cff)', wash: 'rgba(var(--av-accent-rgb, 64,156,255), 0.14)' },
    { d: 'M12 3s5 5.5 5 9a5 5 0 0 1-10 0c0-3.5 5-9 5-9z', tone: 'var(--av-warn, #f0a63a)', wash: 'rgba(var(--av-warn-rgb, 240,166,58), 0.14)' },
    { d: 'M13 3L5 14h6l-1 7 8-11h-6z', tone: 'var(--av-ok, #34c77a)', wash: 'rgba(var(--av-ok-rgb, 52,199,122), 0.14)' },
    { d: 'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z', tone: 'var(--av-ok, #34c77a)', wash: 'rgba(var(--av-ok-rgb, 52,199,122), 0.14)' },
    { d: 'M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z M8 20a3 3 0 0 1 0-6h11', tone: 'var(--av-accent, #409cff)', wash: 'rgba(var(--av-accent-rgb, 64,156,255), 0.14)' }
  ];
  DEFAULTS = [
    { label: 'Motores', icon: 0 }, { label: 'Manutenção', icon: 1 }, { label: 'Telemetria', icon: 2 }, { label: 'Documentos', icon: 3 },
    { label: 'Equipamentos', icon: 4 }, { label: 'Navegação', icon: 5 }, { label: 'Abastecer', icon: 6 }, { label: 'Diário', icon: 9 }
  ];
  BANK_ALL = ['Porão', 'Baterias', 'Gerador', 'Climatização', 'Estabilizador', 'Âncora', 'Maré', 'Canal 16', 'Autonomia', 'Garantias', 'Contatos', 'Checklist de saída', 'Anomalias', 'Horímetros', 'Tanques', 'Clima', 'Posição'];
  state = { tiles: null, moving: -1, note: '', noteTone: 'var(--av-ink3, #9aa3af)', bankHi: false };
  // Lê e valida o que está salvo; null = padrão
  load() { try { const v = JSON.parse(localStorage.getItem(this.KEY) || 'null'); if (Array.isArray(v)) { const ok = this.DEFAULTS.map((d) => d.label).concat(this.BANK_ALL); const seen = {}; return v.filter((t) => t && typeof t.label === 'string' && ok.indexOf(t.label) !== -1 && typeof t.icon === 'number' && !seen[t.label] && (seen[t.label] = 1)).slice(0, 8); } } catch (e) {} return null; }
  componentDidMount() {
    this.setState({ tiles: this.load() });
    // Outra aba/tela salvou: recarrega os blocos
    this._st = (e) => { if (!e || e.key === null || e.key === this.KEY) this.setState({ tiles: this.load(), moving: -1 }); };
    window.addEventListener('storage', this._st);
  }
  componentWillUnmount() { window.removeEventListener('storage', this._st); clearTimeout(this._n); }
  tiles() { return this.state.tiles || this.DEFAULTS; }
  // Lê de novo antes de gravar (ler-alterar-gravar): nada salvo em outra aba se perde
  fresh() { return (this.load() || this.DEFAULTS).map((t) => Object.assign({}, t)); }
  commit(tiles, note, tone) {
    try { localStorage.setItem(this.KEY, JSON.stringify(tiles)); } catch (e) {}
    this.setState({ tiles: tiles, note: note || '', noteTone: tone || 'var(--av-ok, #34c77a)', moving: -1, bankHi: false });
    clearTimeout(this._n); if (note) this._n = setTimeout(() => this.setState({ note: '' }), 3500);
  }
  renderVals() {
    const s = this.state; const tiles = this.tiles(); const labels = tiles.map((t) => t.label);
    // Blocos padrão removidos também voltam ao banco
    const bank = this.DEFAULTS.map((d) => d.label).concat(this.BANK_ALL).filter((b) => labels.indexOf(b) === -1);
    const ICON_OF = { 'Porão': 6, 'Baterias': 7, 'Gerador': 7, 'Climatização': 4, 'Estabilizador': 5, 'Âncora': 5, 'Maré': 2, 'Canal 16': 3, 'Autonomia': 6, 'Garantias': 8, 'Contatos': 4, 'Checklist de saída': 8, 'Anomalias': 1, 'Horímetros': 0, 'Tanques': 6, 'Clima': 2, 'Posição': 5 };
    const iconFor = (label) => (label in ICON_OF ? ICON_OF[label] : 4);
    return {
      subtitle: s.note || ('Perfil de ' + (window.AvantiAuth ? window.AvantiAuth.nome() : 'Otto') + ' · ' + tiles.length + ' de 8 blocos · aparece igual no painel'), noteTone: s.note ? s.noteTone : 'var(--av-ink3, #9aa3af)',
      hint: s.moving >= 0 ? 'Movendo "' + tiles[s.moving].label + '": toque no destino para trocar de lugar · toque de novo para cancelar.' : 'Toque em ⋮⋮ e depois no destino para reordenar · − remove (volta ao banco) · toque no ícone para trocar. Salvo na hora.',
      hintLine: s.moving >= 0 ? 'rgba(var(--av-accent-rgb, 64,156,255), 0.55)' : 'var(--av-line, #1d2229)',
      tiles: tiles.map((t, i) => Object.assign({}, this.ICONS[t.icon % this.ICONS.length], {
        label: t.label, moving: s.moving === i,
        line: s.moving === i ? 'var(--av-accent, #409cff)' : (s.moving >= 0 ? 'rgba(var(--av-accent-rgb, 64,156,255), 0.35)' : 'var(--av-dash, #3a4454)'), bg: s.moving === i ? 'rgba(var(--av-accent-rgb, 64,156,255), 0.10)' : 'var(--av-card, #0f131a)', handleTone: s.moving === i ? 'var(--av-accent, #409cff)' : 'var(--av-ink3, #9aa3af)',
        cycle: () => { const l = this.fresh(); const k = l.findIndex((x) => x.label === t.label); if (k < 0) return this.setState({ tiles: l, moving: -1 }); l[k] = Object.assign({}, l[k], { icon: (l[k].icon + 1) % this.ICONS.length }); this.commit(l, 'Ícone de ' + t.label + ' trocado'); },
        remove: () => { const l = this.fresh().filter((x) => x.label !== t.label); this.commit(l, t.label + ' removido — voltou ao banco'); },
        pick: () => {
          if (s.moving === i) return this.setState({ moving: -1 }); if (s.moving < 0 || !tiles[s.moving]) return this.setState({ moving: i });
          const l = this.fresh(); const a = l.findIndex((x) => x.label === tiles[s.moving].label); const b = l.findIndex((x) => x.label === t.label);
          if (a < 0 || b < 0) return this.setState({ tiles: l, moving: -1 }); const x = l[a]; l[a] = l[b]; l[b] = x; this.commit(l, 'Ordem salva');
        }
      })),
      canAdd: tiles.length < 8,
      focusBank: () => this.setState({ bankHi: true, note: 'Toque em + no banco para adicionar (máximo 8)', noteTone: 'var(--av-accent, #409cff)' }),
      bankLine: s.bankHi ? 'rgba(var(--av-accent-rgb, 64,156,255), 0.55)' : 'var(--av-line, #1d2229)',
      bankLabel: bank.length + ' disponíveis',
      bank: bank.map((b) => ({ label: b, add: () => {
        const l = this.fresh(); if (l.some((x) => x.label === b)) return this.setState({ tiles: l, moving: -1 });
        if (l.length >= 8) { this.setState({ tiles: l, note: 'Máximo de 8 blocos — remova um para adicionar', noteTone: 'var(--av-warn, #f0a63a)' }); return; }
        const def = this.DEFAULTS.find((d) => d.label === b); this.commit(l.concat([{ label: b, icon: def ? def.icon : iconFor(b) }]), b + ' adicionado ao console');
      } })),
      reset: () => this.commit(this.DEFAULTS.slice(), 'Padrão restaurado')
    };
  }
}
</script>
</body>
</html>
